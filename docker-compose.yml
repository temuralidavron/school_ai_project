# MinIO + PostgreSQL + Django (web) + kamera stream (cameras).
# web/cameras GPU dan foydalanadi → hostda nvidia-container-toolkit kerak.

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: school_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-school_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: school_ai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"   # API (Django ishlatadi)
      - "0.0.0.0:9001:9001"      # Web UI (brauzerdan kirish uchun)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO bucket-larni avtomatik yaratadi (birinchi ishga tushganda)
  minio_init:
    image: minio/mc:latest
    container_name: school_ai_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-student-photos};
        mc mb --ignore-existing local/${MINIO_RECOGNITION_BUCKET:-recognition-events};
        echo 'MinIO bucketlar tayyor';
      "
    restart: on-failure

  # ─── Django API / admin ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: school_ai:latest
    container_name: school_ai_web
    restart: unless-stopped
    command: ["./docker/entrypoint-web.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - insightface_models:/root/.insightface
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"   # faqat server'ning o'zidan (panel tashqariga ochilmaydi)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── Kamera stream (yuz tanish + davomat) ───────────────────────────────────
  cameras:
    image: school_ai:latest
    container_name: school_ai_cameras
    restart: unless-stopped
    command: ["./docker/entrypoint-cameras.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - insightface_models:/root/.insightface
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── Kamera patrul (aylanish) — UYQUDA, opt-in ──────────────────────────────
  # Default ishga tushmaydi. Faqat: docker compose --profile patrol up -d patrol
  # Mavjud stream/davomat oqimiga umuman tegmaydi (alohida modul, default off).
  patrol:
    image: school_ai:latest
    container_name: school_ai_patrol
    restart: unless-stopped
    profiles: ["patrol"]
    command: ["python3.14", "manage.py", "run_camera_patrol", "--all"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # ─── Rejalashtirilgan vazifalar (jadval sync + absent) ──────────────────────
  cron:
    image: school_ai:latest
    container_name: school_ai_cron
    restart: unless-stopped
    command: ["./docker/entrypoint-cron.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # ─── Telegram davomat bot — IZOLYATSIYALANGAN ───────────────────────────────
  # Davomat pipeline'ga TEGMAYDI: GPU yo'q, faqat DB read + BotSentReport write.
  # Resurs limit (mem/cpu) — cameras GPU/CPU'siga ta'sir qilmaydi.
  # Bot crash bo'lsa — cameras/web ishlayveradi (alohida konteyner).
  bot:
    image: school_ai:latest
    container_name: school_ai_bot
    restart: unless-stopped
    command: ["python3.14", "manage.py", "run_bot"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.5"        # ko'pi bilan yarim yadro — cameras'ga tegmaydi
          memory: 512M       # ko'pi bilan 512MB

  # ─── DEEPSTREAM PIPELINE (opt-in, profile: deepstream) ──────────────────────
  # Faqat: docker compose --profile deepstream up -d
  # Mavjud cameras stream'ga TEGMAYDI (alohida pipeline)
  kafka:
    image: bitnami/kafka:3.7
    container_name: school_ai_kafka
    restart: unless-stopped
    profiles: ["deepstream"]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: school_ai_kafka_ui
    restart: unless-stopped
    profiles: ["deepstream"]
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: school-deepstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # DeepStream pipeline (yuz topish + Kafka producer)
  deepstream:
    build:
      context: ./deepstream/pipeline
      dockerfile: Dockerfile
    image: school_ai_deepstream:latest
    container_name: school_ai_deepstream
    restart: unless-stopped
    profiles: ["deepstream"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: deepstream-faces
      CAMERA_ID: ${DEEPSTREAM_CAMERA_ID:-1}
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    volumes:
      - ./deepstream/pipeline:/workspace/pipeline:ro
      - ./deepstream/configs:/workspace/configs:ro
      - ./deepstream/data:/workspace/data:ro
      - ./deepstream/models:/workspace/models
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/workspace/data/sinf.mp4"]

  # Django Kafka consumer (DeepStream xabarlarini qayta ishlaydi)
  kafka_consumer:
    image: school_ai:latest
    container_name: school_ai_kafka_consumer
    restart: unless-stopped
    profiles: ["deepstream"]
    command: ["python3.14", "manage.py", "kafka_consumer"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: deepstream-faces
      KAFKA_GROUP_ID: attendance-consumer
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - insightface_models:/root/.insightface
      - ./logs:/app/logs

volumes:
  postgres_data:
  minio_data:
  media_data:
  static_data:
  insightface_models:
