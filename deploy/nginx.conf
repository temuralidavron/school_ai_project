# Nginx konfiguratsiyasi — school_attendace_v1
# /etc/nginx/sites-available/school_attendance ga ko'chiring
# Keyin: sudo ln -s /etc/nginx/sites-available/school_attendance /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream django_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name SERVER_IP_OR_DOMAIN;    # <-- server IP yoki domeningizni yozing

    client_max_body_size 50M;           # foto upload uchun

    # ── Static fayllar ────────────────────────────────────────────────────────
    location /static/ {
        alias /home/ubuntu/school_attendace_v1/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media fayllar (MinIO ishlatilsa bu blok shart emas) ──────────────────
    location /media/ {
        alias /home/ubuntu/school_attendace_v1/media/;
        expires 1d;
        access_log off;
    }

    # ── MJPEG stream — buffer o'chirilishi kerak ──────────────────────────────
    location /monitoring/mjpeg/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Django API va boshqa so'rovlar ────────────────────────────────────────
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ── Xavfsizlik sarlavhalari ───────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    access_log /var/log/nginx/school_attendance_access.log;
    error_log  /var/log/nginx/school_attendance_error.log;
}
