# MinIO + PostgreSQL + Django (web) + kamera stream (cameras).
# web/cameras GPU dan foydalanadi → hostda nvidia-container-toolkit kerak.

# Log rotation — 2026-08-25. Busiz konteyner loglari CHEKSIZ o'sadi:
# ds3 har kadrda yozadi (~2-4 GB/kun), disk to'lsa Postgres read-only ga
# o'tadi va davomat yo'qoladi. 3 fayl x 100 MB = servis boshiga max 300 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: school_ai_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-school_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-school_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: school_ai_minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"   # API (Django ishlatadi)
      # 2026-08-20: 0.0.0.0 dan 127.0.0.1 ga yopildi — bu konsolda TALABA
      # RASMLARI ko'rinadi va paroli .env dagi minioadmin/minioadmin123.
      # Kerak bo'lsa SSH tunnel: ssh -L 9001:127.0.0.1:9001 user@server
      - "127.0.0.1:9001:9001"    # Web UI (faqat serverning o'zidan)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO bucket-larni avtomatik yaratadi (birinchi ishga tushganda)
  minio_init:
    image: minio/mc:latest
    container_name: school_ai_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-student-photos};
        mc mb --ignore-existing local/${MINIO_RECOGNITION_BUCKET:-recognition-events};
        echo 'MinIO bucketlar tayyor';
      "
    restart: on-failure

  # ─── Django API / admin ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: school_ai:latest
    container_name: school_ai_web
    restart: unless-stopped
    logging: *default-logging
    command: ["./docker/entrypoint-web.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - insightface_models:/root/.insightface
      - ./logs:/app/logs
      - ./deepstream/data:/app/deepstream_data:ro
    ports:
      - "127.0.0.1:8000:8000"   # faqat server'ning o'zidan (panel tashqariga ochilmaydi)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── Kamera stream — ESKI YO'L (OpenCV + InsightFace, ~14 fps) ──────────────
  # DeepStream (ds3 + kafka_consumer) uni almashtirdi — JAMI_2.md "F5: eski
  # CameraStreamService pensiyasi". 2026-08-20 da PROFIL ostiga olindi.
  #
  # Nega: ikkalasi bir vaqtda ishlaganda
  #   - bitta kameraga IKKI ulanish ochiladi (kamera 2-4 ulanishni ko'taradi;
  #     ortiqcha ulanish + qayta ulanish halqasi uzilishga olib keladi)
  #   - GPU da InsightFace IKKI nusxa yuklanadi (~2-4 GB behuda)
  #   - ikkalasi ham LiveFrameProcessorService ni chaqiradi -> dublikat davomat
  #   - har sozlama ikki joyda to'g'rilanadi (threshold chalkashligi shundan)
  # 10 kamerada eski yo'l baribir yetmaydi: 14 fps / 10 = 1.4 fps har kameraga.
  #
  # Kerak bo'lsa (DeepStream ishlamay qolsa, bitta kamera bilan tekshiruv):
  #   docker compose --profile legacy up -d cameras
  cameras:
    image: school_ai:latest
    container_name: school_ai_cameras
    restart: unless-stopped
    logging: *default-logging
    profiles: ["legacy"]
    command: ["./docker/entrypoint-cameras.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - insightface_models:/root/.insightface
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── Kamera patrul (aylanish) — UYQUDA, opt-in ──────────────────────────────
  # Default ishga tushmaydi. Faqat: docker compose --profile patrol up -d patrol
  # Mavjud stream/davomat oqimiga umuman tegmaydi (alohida modul, default off).
  patrol:
    image: school_ai:latest
    container_name: school_ai_patrol
    restart: unless-stopped
    logging: *default-logging
    profiles: ["patrol"]
    command: ["python3.14", "manage.py", "run_camera_patrol", "--all"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # ─── Rejalashtirilgan vazifalar (jadval sync + absent) ──────────────────────
  cron:
    image: school_ai:latest
    container_name: school_ai_cron
    restart: unless-stopped
    logging: *default-logging
    command: ["./docker/entrypoint-cron.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # ─── Telegram davomat bot — IZOLYATSIYALANGAN ───────────────────────────────
  # Davomat pipeline'ga TEGMAYDI: GPU yo'q, faqat DB read + BotSentReport write.
  # Resurs limit (mem/cpu) — cameras GPU/CPU'siga ta'sir qilmaydi.
  # Bot crash bo'lsa — cameras/web ishlayveradi (alohida konteyner).
  bot:
    image: school_ai:latest
    container_name: school_ai_bot
    restart: unless-stopped
    logging: *default-logging
    # TELEGRAM_BOT_TOKEN yo'qligi sabab restart-loop edi — opt-in qilindi.
    # Yoqish: TOKEN qo'shib `docker compose --profile bot up -d bot`
    profiles: ["bot"]
    command: ["python3.14", "manage.py", "run_bot"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.5"        # ko'pi bilan yarim yadro — cameras'ga tegmaydi
          memory: 512M       # ko'pi bilan 512MB

  # ─── DEEPSTREAM PIPELINE (opt-in, profile: deepstream) ──────────────────────
  # Faqat: docker compose --profile deepstream up -d
  # Mavjud cameras stream'ga TEGMAYDI (alohida pipeline)
  kafka:
    image: apache/kafka:latest
    container_name: school_ai_kafka
    restart: unless-stopped
    logging: *default-logging
    profiles: ["deepstream", "deepstream-v2"]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDVGMg=="
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Kafka UI — faqat DIAGNOSTIKA uchun (navbat, lag, xabarlar ko'rish).
  # 2026-08-20: "debug" profiliga ko'chirildi va port 127.0.0.1 ga yopildi —
  # avval 0.0.0.0:8080 da edi, ya'ni ichki tarmoqdagi har kim consumer group,
  # lag va xabar mazmunini ko'ra olardi (autentifikatsiyasiz).
  # Kerak bo'lsa: docker compose --profile debug up -d kafka-ui
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: school_ai_kafka_ui
    restart: unless-stopped
    logging: *default-logging
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: school-deepstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Face detection pipeline (InsightFace GPU + Kafka producer)
  # NGC auth va nvinfer model fayli kerak emas
  # ESKI DeepStream v1 (7.1). deepstream_v3 uni almashtirdi.
  # 2026-08-20: "deepstream" profilidan chiqarildi — aks holda yangi yo'lni
  # ko'targanda bu ham ko'tarilib, GPU va kameraga ortiqcha yuk berardi.
  # Kerak bo'lsa: docker compose --profile legacy-v1 up -d deepstream
  deepstream:
    build:
      context: ./deepstream/pipeline
      dockerfile: Dockerfile
    image: school_ai_deepstream:latest
    container_name: school_ai_deepstream
    restart: unless-stopped
    logging: *default-logging
    profiles: ["legacy-v1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: deepstream-faces
      CAMERA_ID: ${DEEPSTREAM_CAMERA_ID:-1}
      FRAME_SKIP: ${DEEPSTREAM_FRAME_SKIP:-15}
      MIN_FACE_SIZE: ${MIN_FACE_SIZE:-80}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      INSIGHTFACE_HOME: /root/.insightface
    volumes:
      - ./deepstream/pipeline:/workspace/pipeline:ro
      - ./deepstream/data:/workspace/data:ro
      - insightface_models:/root/.insightface
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/workspace/data/sinf.mp4"]

  # Django Kafka consumer (DeepStream xabarlarini qayta ishlaydi)
  kafka_consumer:
    image: school_ai:latest
    container_name: school_ai_kafka_consumer
    restart: unless-stopped
    logging: *default-logging
    profiles: ["deepstream"]
    command: ["python3.14", "manage.py", "kafka_consumer"]
    env_file: .env
    environment:
      DB_HOST: db
      MINIO_HOST: minio
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: deepstream-faces
      KAFKA_GROUP_ID: attendance-consumer
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - insightface_models:/root/.insightface
      - ./logs:/app/logs
      - ./deepstream/data:/app/ds_data          # track_names.json uchun

  # ── DeepStream v3 — JONLI production pipeline (F1) ──────────────────────────
  # Manbalar: deepstream_v3/configs/sources.json (manage.py export_ds_sources).
  # Ishga tushirish: docker compose --profile deepstream up -d ds3
  ds3:
    build:
      context: ./deepstream_v3
      dockerfile: Dockerfile
    image: school_ai_ds3:latest
    container_name: school_ai_ds3
    restart: unless-stopped
    logging: *default-logging
    profiles: ["deepstream"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CAMERA_IDS: ""                            # sources.json'dan olinadi
      PGIE_CONFIG: /ds3/configs/pgie_det10g_1280.txt
      DET_INPUT_SZ: "1280"
      REALTIME: "1"
      VIS_EVERY: "2"
      TRACK_SEND_COOLDOWN: "3"
      SOURCE_STALE_SEC: "30"
      # Detection oralig'i: bo'sh = configdagi (har kadr). 10 kamera bilan
      # DS_INTERVAL=2 SHART: engine 224 fps, 10x25=250 kerak (interval=0 da
      # yetmaydi), interval=2 da 83 fps — 2.7x zaxira. Host'dan beriladi:
      #   DS_INTERVAL=2 docker compose --profile deepstream up -d ds3
      DS_INTERVAL: "${DS_INTERVAL:-}"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 2026-08-20: 0.0.0.0 dan 127.0.0.1 ga yopildi — bu jonli video oqim
      # (sinfdagi bolalar). Rahbariyatga ko'rsatish kerak bo'lsa vaqtincha:
      #   docker compose -f docker-compose.yml -f docker-compose.share.yml up -d ds3
      - "127.0.0.1:8554:8554"                   # MJPEG jonli ko'rish
    volumes:
      - insightface_models:/root/.insightface:ro
      - ./deepstream_v3/engines:/engines:ro
      - ./deepstream_v3/configs:/ds3/configs:ro # sources.json shu yerda
      - ./deepstream/data:/data:ro              # file:// A/B uchun
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # so'nggi kadr 60s ichida bo'lmasa unhealthy -> restart
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/ds3_health 2>/dev/null || echo 0) )) -lt 60"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── Haqiqiy NVIDIA DeepStream pipeline (v2) ─────────────────────────────────
  # Ishlatish: docker compose --profile deepstream-v2 up deepstream_v2
  # Avval: docker login nvcr.io (NGC API key kerak)
  # Keyin: docker compose --profile deepstream-v2 run --rm deepstream_v2_build
  deepstream_v2:
    build:
      context: ./deepstream_v2
      dockerfile: Dockerfile
    image: school_ai_deepstream_v2:latest
    container_name: school_ai_deepstream_v2
    restart: unless-stopped
    logging: *default-logging
    profiles: ["deepstream-v2"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: deepstream-faces
      CAMERA_IDS: ${DEEPSTREAM_CAMERA_IDS:-1}
      GPU_ID: 0
      # Detection: video o'z o'lchamida (1920x1080) oqadi — downscale yo'q.
      # 1280x720 ga tushirilsa uzoq/o'rta qatordagi yuzlar det bosqichida yo'qoladi.
      MUX_WIDTH: "1920"
      MUX_HEIGHT: "1080"
      DET_THRESHOLD: "0.35"
      MIN_FACE_PX: "20"
      # Tez davomat: har track 3s da qayta tekshiriladi (10 juda sekin edi).
      TRACK_SEND_COOLDOWN: "3"
      # Frontal filtr yumshatildi (0.42→0.6) — yon burgan yuzlar ham qabul,
      # dars boshida tez tanish uchun (recognition baribir noto'g'rini rad etadi).
      MAX_YAW_RATIO: "0.6"
      # Yozib olingan video'ni tez qayta ishlash: har 8-kadrda inference.
      # Jonli RTSP'da bu 1 bo'lishi kerak (real-time). Faqat test video uchun.
      FRAME_SKIP: "8"
      # Tracker barqarorligi: yuz bir necha kadr ko'rinmasa ham track o'lmasin
      # (max_lost oshirildi), harakatlanuvchi yuz uchun IOU biroz yumshoq.
      TRACKER_MAX_LOST: "150"
      TRACKER_IOU_THR: "0.25"
      MODELS_DIR: /root/.insightface/models
      PGIE_CONFIG: /ds_pipeline/configs/pgie_det10g.txt
      TRACKER_CONFIG: /ds_pipeline/configs/tracker_nvdcf.txt
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    ports:
      - "8554:8554"    # MJPEG vizual stream
    volumes:
      - insightface_models:/root/.insightface:ro  # buffalo_l modellar
      - ./deepstream/data:/data                   # sinf.mp4 + track_names.json
      - ./deepstream_v2/pipeline:/ds_pipeline/pipeline:ro
      - ./deepstream_v2/configs:/ds_pipeline/configs:ro
      - deepstream_v2_engines:/engines           # TRT engine cache (alohida)
    depends_on:
      - kafka
    # Video fayl uchun:
    command: ["--video", "/data/sinf.mp4", "--camera-ids", "1"]

  # TRT engine build (bir marta ishga tushiriladi)
  deepstream_v2_build:
    image: school_ai_deepstream_v2:latest
    container_name: school_ai_ds_build
    profiles: ["deepstream-v2"]
    entrypoint: ["/ds_pipeline/scripts/build_engines.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    environment:
      MODELS_DIR: /root/.insightface/models
      ENGINES_DIR: /engines
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - insightface_models:/root/.insightface:ro
      - deepstream_v2_engines:/engines

volumes:
  postgres_data:
  minio_data:
  media_data:
  static_data:
  insightface_models:
  deepstream_v2_engines:
